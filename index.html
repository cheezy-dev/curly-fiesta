<!DOCTYPE html>
<html>

<head>
    <title>My First Navbar</title>

    <style>
        .navbar {
            background-color: black;
            padding: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: yellow;
        }
        
    </style>

</head>

<body>
    <nav class="navbar">
        <div class="logo">MySite</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

</body>

</html>
